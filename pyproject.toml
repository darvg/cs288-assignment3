[project]
name = "cs288-a3-rag"
version = "0.1.0"
description = "UC Berkeley EECS factoid QA RAG system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
offline = [
    "beautifulsoup4>=4.12",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
